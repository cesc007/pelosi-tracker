name: Pelosi Portfolio Checker

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          pip install requests

      - name: 🚀 Ejecutar script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python pelosi_tracker.py

      - name: 💾 Guardar cambios en el repositorio si hubo modificaciones
        run: |
          # Activamos el modo verbose (xtrace) para que imprima cada comando y su error exacto
          set -x
          
          git config --global user.name "Bot de Pelosi"
          git config --global user.email "bot@actions.com"
          
          git status
          git add last_portfolio.json
          git diff --cached --quiet || git commit -m "Actualización automática: Nuevo movimiento de Pelosi"
          
          # Hacemos el push imprimiendo la salida detallada
          git push origin HEAD:main || git push origin HEAD:master
